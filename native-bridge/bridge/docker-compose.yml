# owlet-bridge — native Owlet/Kalay -> RTSP, configured entirely from the web UI.
#
#   docker compose up -d --build
#   open  https://<host>:8088  -> enter your Owlet login, Connect & Diagnose
#
# No emulator. Just credentials in, RTSP out — the wyze-bridge model.

name: owlet-bridge

services:
  owlet-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bionic   # Bionic/Termux runtime so the Android TUTK libs load
    image: ghcr.io/btoth525/owlet-bridge-native:latest
    container_name: owlet-bridge
    restart: unless-stopped
    volumes:
      - ${APPDATA:-/mnt/user/appdata/owlet}/config:/config   # settings persist here
      - ./libs:/app/libs      # TUTK .so libs; read-write because the control panel's "Upload & extract" writes them here
    ports:
      - "8088:8088"   # control panel
      - "1984:1984"   # go2rtc video UI
      - "8554:8554"   # RTSP -> Frigate
      - "8555:8555/tcp"
      - "8555:8555/udp"
