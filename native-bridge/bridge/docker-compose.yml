# owlet-bridge — native Owlet/Kalay -> RTSP, configured entirely from the web UI.
#
#   docker network create owlet-net          # once; attach Frigate to it too
#   docker compose up -d --build
#   open  https://<host>:8088
#
# Exposure model (secure by default):
#   * Only the control panel (8088, HTTP Basic auth always on) is published.
#   * go2rtc's HTTP API (1984) listens on container loopback only. It can rewrite
#     its own config and run commands, so it is never published.
#   * RTSP (8554) is NOT published. Frigate pulls it over the shared Docker
#     network `owlet-net`, with go2rtc credentials:
#         rtsp://<GO2RTC_USER>:<GO2RTC_PASS>@owlet-bridge:8554/<camera>
#     (GO2RTC_USER defaults to "owlet"; if GO2RTC_PASS is unset a random one
#      is generated once into /config/secrets/go2rtc.json, mode 0600).
# Credentials and policy switches below come from the shell or an .env file
# next to this compose file; anything unset falls back to the default shown.
# (.dockerignore keeps .env and other local secrets out of the build context.)
#   * WebRTC (8555) is not published.
# If Frigate runs with host networking instead, publish RTSP to one host IP
# (e.g. "<host-ip>:18554:8554"), firewall it to the Frigate host only, and set
# PUBLIC_RTSP_PORT=18554 so the control panel's RTSP link shows that port
# (or OWLET_ADVERTISE_RTSP=<host>:18554 to pin the whole address).
#
# Upgrading from an older copy of this file: the default config location moved
# from /mnt/user/appdata/owlet to /mnt/user/appdata/owlet-camera. If you never
# set APPDATA, recreating the service would start from an empty /config (new
# credentials, no cameras). Either keep the old location with
# APPDATA=/mnt/user/appdata/owlet in .env, or move the folder once with the
# service stopped:
#   docker compose down
#   mkdir -p /mnt/user/appdata/owlet-camera
#   mv /mnt/user/appdata/owlet/config /mnt/user/appdata/owlet-camera/

name: owlet-bridge

services:
  owlet-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bionic   # Bionic/Termux runtime so the Android TUTK libs load
    image: ghcr.io/btoth525/owlet-bridge-native:latest
    container_name: owlet-bridge
    restart: unless-stopped
    init: true                        # reap anything a stream process leaves behind
    security_opt:
      - no-new-privileges:true
    environment:
      # Control-panel auth is always on. If OWLET_UI_PASS is unset (or empty),
      # a random password is generated once into /config/secrets/ui.json for
      # user OWLET_UI_USER (default "admin"); `docker exec owlet-bridge cat
      # /config/secrets/ui.json` shows it.
      OWLET_UI_USER: "${OWLET_UI_USER:-admin}"
      OWLET_UI_PASS: "${OWLET_UI_PASS:-}"
      # 1 = enable the talk-back / streamed sound playback endpoints (audio into the nursery)
      OWLET_TALK: "${OWLET_TALK:-0}"
      # 1 = run the sock cloud poller; it WRITES APP_ACTIVE to the sock
      OWLET_VITALS_POLL: "${OWLET_VITALS_POLL:-0}"
      # 1 = enable the stream self-heal watchdog (restarts stalled streams)
      OWLET_WATCHDOG: "${OWLET_WATCHDOG:-0}"
      # 1 (default) = after a connect / AV-login failure the bridge may log in to the
      #     Owlet cloud once to refresh a rotated camera key, bounded by a persistent
      #     backoff and attempt cap. 0 = never log in automatically (strictest): a rotated
      #     key is then refreshed by hand with "Connect / refresh key" in the control panel.
      OWLET_REFRESH_KMS: "${OWLET_REFRESH_KMS:-1}"
      # 1 = blank the stored Owlet email/password once every configured camera has a key.
      #     Add ALL cameras first; adding one later needs the account re-entered in the control panel.
      OWLET_FORGET_ACCOUNT: "${OWLET_FORGET_ACCOUNT:-0}"
      # RTSP credentials Frigate uses. If GO2RTC_PASS is unset (or empty), a random
      # password is generated once into /config/secrets/go2rtc.json.
      GO2RTC_USER: "${GO2RTC_USER:-owlet}"
      GO2RTC_PASS: "${GO2RTC_PASS:-}"
      # Host port you published RTSP on (see the header); empty = RTSP not published.
      PUBLIC_RTSP_PORT: "${PUBLIC_RTSP_PORT:-}"
      # host:port ([addr]:port for IPv6) to show in the RTSP link; overrides PUBLIC_RTSP_PORT.
      OWLET_ADVERTISE_RTSP: "${OWLET_ADVERTISE_RTSP:-}"
    volumes:
      - ${APPDATA:-/mnt/user/appdata/owlet-camera}/config:/config   # settings persist here (same dir as the Unraid template)
      - ./libs:/app/libs      # TUTK .so libs; read-write because the control panel's "Upload & extract" writes them here
    ports:
      - "8088:8088"   # control panel. Prefer "127.0.0.1:8088:8088" + SSH tunnel / auth proxy.
    networks:
      - owlet-net

networks:
  owlet-net:
    external: true
